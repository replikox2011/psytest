<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Школьная психологическая система — Muhammad al-Xorazmiy" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>PsychSystem — Al-Xorazmiy</title>
    <script>
      // GitHub Pages SPA redirect — decode path from ?p= query param
      (function(l) {
        if (l.search[1] === 'p' && l.search[2] === '=') {
          var decoded = l.search.slice(3).split('&').reduce(function(memo, item) {
            var parts = item.split('=');
            if (parts[0] === 'q') {
              return memo + '?' + parts.slice(1).join('=').replace(/~and~/g, '&');
            }
            return memo;
          }, l.search.slice(3).split('&')[0].replace(/~and~/g, '&'));
          window.history.replaceState(null, null,
            l.pathname + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <noscript>Для работы приложения необходим JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
