<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PsychSystem</title>
    <script>
      // GitHub Pages SPA redirect hack — учитывает basename /psytest
      var segmentCount = 1; // кол-во сегментов в basename (/psytest = 1)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
        '/?p=/' + l.pathname.split('/').slice(1 + segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
